name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Placeholder values only. CI never sees real secrets.
      - name: Create .env from the example
        run: cp .env.example .env

      - name: Run the tests in Docker
        run: docker compose run --rm --build tests

      - name: Stop the database
        if: always()
        run: docker compose down --volumes

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Every API call is mocked: no test reaches a real API
      - name: Run the frontend tests
        run: npm test

      - name: Build
        run: npm run build
